name: Turvleto Content Engine

on:
  workflow_dispatch:
  # Расписание включим после завершения редакционного контроля.
  # schedule:
  #   - cron: "0 1 * * *" # 08:00 Vietnam time (UTC+7)

permissions:
  contents: write

jobs:
  generate-topics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Generate daily topics
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
        run: python src/content_engine.py generate
      - name: Check source URL availability
        shell: bash
        run: |
          TOPIC_FILE="$(ls -t content/selected/topics-*.json | head -n 1)"
          REPORT_FILE="content/source-checks/source-check-report.json"
          python src/check_sources.py "$TOPIC_FILE" --report "$REPORT_FILE"
      - name: Commit generated topics and source report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/history.json content/selected/ content/source-checks/
          git diff --cached --quiet || git commit -m "Add daily topics and source check report"
          git push
