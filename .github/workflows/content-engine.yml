name: Turvleto Content Engine

on:
  workflow_dispatch:
  # Расписание будет включено после настройки OPENAI_API_KEY и успешного тестового запуска.
  # schedule:
  #   - cron: "0 1 * * *" # 08:00 Vietnam time (UTC+7)

permissions:
  contents: write

jobs:
  generate-topics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Generate daily topics
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
        run: python src/content_engine.py generate
      - name: Commit generated topics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/history.json content/selected/
          git diff --cached --quiet || git commit -m "Add daily content topics"
          git push
